<fieldset class="color-selector">
  <legend class="color-selector__legend">
    Color <span class="color-selector__value">— {{ selected() }}</span>
  </legend>

  <div class="color-selector__options" role="group">
    @for (color of colors(); track color; let i = $index) {
      <button
        class="color-selector__option"
        type="button"
        [disabled]="isUnavailable(color)"
        [class.color-selector__option--selected]="selected() === color"
        [attr.aria-pressed]="selected() === color"
        [attr.aria-label]="'Color ' + color"
        (click)="select(color)"
      >
        <span class="color-selector__swatch" [style.background-color]="color"></span>
      </button>
    }
  </div>
</fieldset>
