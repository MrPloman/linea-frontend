<article class="product-card">
  <div class="product-card__media">
    <a
      class="product-card__media-link"
      [routerLink]="['/producto', product().displayId]"
      [attr.aria-label]="'Ver ' + product().displayName"
    >
      <img
        class="product-card__image"
        [src]="product().variantImageUrl"
        [alt]="product().displayName"
        width="600"
        height="800"
        loading="lazy"
      />
    </a>

    <!-- TODO(pol): acción real de favoritos/wishlist -->
    <button
      class="product-card__wishlist"
      type="button"
      [attr.aria-label]="'Guardar ' + product().displayName"
    >
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <path
          d="M12 20.5S3.5 15.5 3.5 9.5a4.5 4.5 0 0 1 8.5-2 4.5 4.5 0 0 1 8.5 2c0 6-8.5 11-8.5 11z"
        />
      </svg>
    </button>
  </div>

  <div class="product-card__info">
    <h3 class="product-card__name">
      <a class="product-card__name-link" [routerLink]="['/producto', product().displayId]">
        {{ product().displayName }}
      </a>
    </h3>

    <p class="product-card__price">
      @if (cheapestVariant(); as variant) {
        <span class="product-card__price-current"
          >Desde {{ variant.priceValue.toDisplayString() }}</span
        >
      }
    </p>
  </div>
</article>
